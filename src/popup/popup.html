<!DOCTYPE html>
<html lang="en" data-preset="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkExtension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-shell">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <span class="brand-emblem" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" fill="url(#de-grad)" opacity="0.22"></circle>
            <path d="M19.5 14.2A7.5 7.5 0 0 1 9.8 4.5a7.5 7.5 0 1 0 9.7 9.7Z" fill="url(#de-grad)"></path>
            <circle cx="17.2" cy="6.8" r="1.3" fill="currentColor"></circle>
            <defs>
              <linearGradient id="de-grad" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#8da8ff"></stop>
                <stop offset="100%" stop-color="#5b7bff"></stop>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <div class="brand-text">
          <h1 class="brand-title">DarkExtension</h1>
          <span id="global-state-label" class="brand-subtitle">Active</span>
        </div>
      </div>

      <div class="header-actions">
        <label class="switch switch-power" title="Toggle DarkExtension globally">
          <input id="global-toggle" type="checkbox" aria-label="Toggle DarkExtension globally">
          <span class="switch-track">
            <span class="switch-thumb"></span>
          </span>
        </label>
        <button id="btn-open-sidepanel" class="icon-btn" type="button" title="Dock in Side Panel" aria-label="Dock in Side Panel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="15" y1="3" x2="15" y2="21"></line>
          </svg>
        </button>
        <button id="btn-open-options" class="icon-btn" type="button" title="Open Dashboard &amp; Settings" aria-label="Open Options Dashboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Inline status banner -->
    <div id="status-banner" class="status-banner hidden" role="status" aria-live="polite"></div>

    <!-- Current Site Card -->
    <section class="card site-card" aria-label="Current Site Controls">
      <div class="site-card-top">
        <div class="site-identity">
          <div class="site-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
          <div class="site-meta">
            <div id="site-hostname" class="site-hostname">Loading tab...</div>
            <div class="site-status-row">
              <span id="site-status-pill" class="status-pill status-neutral">Checking</span>
              <span id="site-theme-detail" class="site-theme-detail hidden"></span>
            </div>
          </div>
        </div>

        <label class="switch" title="Enable or exclude current site">
          <input id="site-toggle" type="checkbox" aria-label="Toggle DarkExtension for current site">
          <span class="switch-track">
            <span class="switch-thumb"></span>
          </span>
        </label>
      </div>

      <div id="mode-pills" class="segmented-control" role="group" aria-label="Dark mode engine for current site">
        <button type="button" class="seg-btn" data-mode="auto">Auto</button>
        <button type="button" class="seg-btn" data-mode="dynamic">Dynamic</button>
        <button type="button" class="seg-btn" data-mode="filter">Filter</button>
        <button type="button" class="seg-btn" data-mode="off">Off</button>
      </div>

      <div id="force-dark-row" class="force-dark-row hidden">
        <span class="force-dark-hint">Native dark theme detected</span>
        <button id="btn-force-dark" type="button" class="btn-chip">Force Dark Mode</button>
      </div>

      <div id="unsupported-hint" class="unsupported-hint hidden">
        Browser internal pages cannot be modified by extensions.
      </div>
    </section>

    <!-- Theme Preset Swatches -->
    <section class="card" aria-label="Theme Presets">
      <div class="section-header">
        <span class="section-title">Theme Preset</span>
        <span id="active-preset-name" class="section-value">Midnight</span>
      </div>
      <div id="preset-swatches" class="preset-grid" role="radiogroup" aria-label="Choose dark theme preset">
        <button type="button" class="swatch-btn is-active" data-preset="midnight" aria-checked="true" role="radio">
          <span class="swatch-preview swatch-midnight">
            <span class="swatch-bar"></span>
            <span class="swatch-dot"></span>
          </span>
          <span class="swatch-label">Midnight</span>
        </button>
        <button type="button" class="swatch-btn" data-preset="oled" aria-checked="false" role="radio">
          <span class="swatch-preview swatch-oled">
            <span class="swatch-bar"></span>
            <span class="swatch-dot"></span>
          </span>
          <span class="swatch-label">OLED</span>
        </button>
        <button type="button" class="swatch-btn" data-preset="warm" aria-checked="false" role="radio">
          <span class="swatch-preview swatch-warm">
            <span class="swatch-bar"></span>
            <span class="swatch-dot"></span>
          </span>
          <span class="swatch-label">Warm</span>
        </button>
        <button type="button" class="swatch-btn" data-preset="slate" aria-checked="false" role="radio">
          <span class="swatch-preview swatch-slate">
            <span class="swatch-bar"></span>
            <span class="swatch-dot"></span>
          </span>
          <span class="swatch-label">Slate</span>
        </button>
        <button type="button" class="swatch-btn" data-preset="nord" aria-checked="false" role="radio">
          <span class="swatch-preview swatch-nord">
            <span class="swatch-bar"></span>
            <span class="swatch-dot"></span>
          </span>
          <span class="swatch-label">Nord</span>
        </button>
      </div>
    </section>

    <!-- Live Adjustment Sliders -->
    <section class="card" aria-label="Live Adjustments">
      <div class="section-header">
        <span class="section-title">Adjustments</span>
        <button id="btn-reset-adjustments" type="button" class="text-btn">Reset</button>
      </div>

      <div class="sliders-list">
        <div class="slider-row">
          <div class="slider-label-row">
            <label for="slider-brightness">Brightness</label>
            <span id="val-brightness" class="slider-val">100%</span>
          </div>
          <input id="slider-brightness" type="range" min="50" max="130" step="1" value="100">
        </div>

        <div class="slider-row">
          <div class="slider-label-row">
            <label for="slider-contrast">Contrast</label>
            <span id="val-contrast" class="slider-val">100%</span>
          </div>
          <input id="slider-contrast" type="range" min="70" max="140" step="1" value="100">
        </div>

        <div class="slider-row">
          <div class="slider-label-row">
            <label for="slider-sepia">Warmth / Sepia</label>
            <span id="val-sepia" class="slider-val">0%</span>
          </div>
          <input id="slider-sepia" type="range" min="0" max="60" step="1" value="0">
        </div>

        <div class="slider-row">
          <div class="slider-label-row">
            <label for="slider-image-brightness">Image Brightness</label>
            <span id="val-image-brightness" class="slider-val">90%</span>
          </div>
          <input id="slider-image-brightness" type="range" min="50" max="100" step="1" value="90">
        </div>
      </div>

      <div class="dim-toggle-row">
        <label for="toggle-dim-images" class="dim-toggle-label">
          <span>Dim bright images &amp; media</span>
        </label>
        <label class="switch switch-sm">
          <input id="toggle-dim-images" type="checkbox" checked aria-label="Dim bright images and media">
          <span class="switch-track">
            <span class="switch-thumb"></span>
          </span>
        </label>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <div class="footer-left">
        <span id="schedule-summary" class="schedule-summary">Manual</span>
        <span class="shortcut-badge" title="Toggle current site shortcut">Alt+Shift+D</span>
      </div>
      <div class="footer-links">
        <button id="btn-custom-css" type="button" class="link-btn">Custom CSS</button>
        <span class="dot-sep" aria-hidden="true">·</span>
        <button id="btn-footer-options" type="button" class="link-btn">Options</button>
      </div>
    </footer>
  </div>

  <script src="../shared/constants.js"></script>
  <script src="../shared/site-matcher.js"></script>
  <script src="../shared/schedule.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
